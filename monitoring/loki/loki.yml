auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: "2024-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  filesystem:
    directory: /loki/chunks
  tsdb_shipper:
    active_index_directory: /loki/tsdb-index
    cache_location: /loki/tsdb-cache

limits_config:
  retention_period: 30d
  ingestion_rate_mb: 10
  ingestion_burst_size_mb: 20
  # Backs the log-volume histogram Grafana renders above Explore results and the
  # "volume by level" panels on the logs dashboard. Off by default.
  volume_enabled: true
  # OTLP log records carry TraceId/SpanId plus the app's enrichment tags
  # (JobId, Username, Step) as structured metadata rather than labels — that is
  # what keeps them queryable without turning each one into a label dimension.
  allow_structured_metadata: true

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
