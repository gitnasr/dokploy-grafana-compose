apiVersion: 1

providers:
  - name: IGPD
    orgId: 1
    folder: IGPD
    type: file
    # Dashboards are source-controlled, so editing one in the UI and losing it on
    # the next redeploy is the expected failure mode. Disabling deletion at least
    # keeps a removed file from silently wiping the dashboard mid-incident.
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      # Must stay outside /var/lib/grafana — the grafana-data volume mounts over
      # that path and shadowed the baked-in dashboards, so this provider spent
      # months reading an empty directory. See the note in the Dockerfile.
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: false
