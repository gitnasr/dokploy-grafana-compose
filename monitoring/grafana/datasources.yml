apiVersion: 1

# Datasource UIDs are pinned explicitly. They are not cosmetic: every
# cross-datasource link below references another datasource *by uid*, and
# dashboards provisioned alongside this file do the same. An unpinned uid gets
# an autogenerated value at first start, which silently breaks the links.
#
# Loki's uid is the autogenerated value this Grafana already assigned it, NOT a
# tidy "loki". Existing dashboards (Kakaw — Logs) reference it by that uid, and
# renaming it here would orphan their panels. Pinning the live value fixes the
# dangling reference below without breaking anything already built.

datasources:
  - name: Loki
    type: loki
    uid: P8E80F9AEF21F6940
    access: proxy
    url: http://loki:3100
    isDefault: false
    jsonData:
      # OTLP log records carry TraceId natively, and Alloy's Loki exporter
      # surfaces it as structured metadata rather than in the log line. The
      # first derived field reads that; the second is a text fallback for
      # anything that logs a trace id inline (e.g. JSON console output from a
      # service not on the OTLP path).
      derivedFields:
        - name: TraceID
          datasourceUid: tempo
          matcherType: label
          matcherRegex: trace_id
          url: "$${__value.raw}"
          urlDisplayLabel: View trace
        - name: TraceIDInline
          datasourceUid: tempo
          matcherType: regex
          matcherRegex: '(?:"?trace[_-]?[Ii]d"?[=:]\s*"?)([a-f0-9]{32})'
          url: "$${__value.raw}"
          urlDisplayLabel: View trace

  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    isDefault: false
    jsonData:
      # Upstream had `datasourceUid: loki` here, but Loki had no pinned uid — so
      # this referenced a datasource that never existed and trace->logs
      # navigation was dead on arrival.
      tracesToLogsV2:
        datasourceUid: P8E80F9AEF21F6940
        filterByTraceID: true
        filterBySpanID: false
        # Loki's label is `service_name`; the span attribute is `service.name`.
        tags:
          - key: service.name
            value: service_name
        spanStartTimeShift: -1h
        spanEndTimeShift: 1h
      tracesToMetrics:
        datasourceUid: mimir
        tags:
          - key: service.name
            value: job
        queries:
          - name: Request rate
            query: 'sum(rate(traces_spanmetrics_calls_total{$$__tags}[$$__rate_interval]))'
          - name: Error rate
            query: 'sum(rate(traces_spanmetrics_calls_total{$$__tags,status_code="STATUS_CODE_ERROR"}[$$__rate_interval]))'
          - name: p95 duration
            query: 'histogram_quantile(0.95, sum by (le) (rate(traces_spanmetrics_latency_bucket{$$__tags}[$$__rate_interval])))'
      serviceMap:
        datasourceUid: mimir
      nodeGraph:
        enabled: true
      search:
        hide: false
      traceQuery:
        timeShiftEnabled: true
        spanStartTimeShift: -1h
        spanEndTimeShift: 1h

  - name: Mimir
    type: prometheus
    uid: mimir
    access: proxy
    url: http://mimir:9009/prometheus
    isDefault: true
    jsonData:
      prometheusType: Mimir
      httpMethod: POST
      # Turns any latency/error panel into a click-through to the trace that
      # produced the outlier. Requires send_exemplars on Alloy's remote_write.
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo
