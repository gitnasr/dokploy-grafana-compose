server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

query_frontend:
  search:
    default_result_limit: 20

storage:
  trace:
    backend: local
    block:
      version: vParquet4
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal

# Storage is a local filesystem volume, so retention is the only thing standing
# between trace ingest and a full disk. 14 days.
compactor:
  compaction:
    block_retention: 336h

metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://mimir:9009/api/v1/push
        send_exemplars: true

overrides:
  defaults:
    metrics_generator:
      processors:
        - service-graphs
        - span-metrics
        # local-blocks backs TraceQL metrics queries ({...} | rate()), which is
        # what the traces dashboard uses for span-level rate/latency breakdowns
        # that span-metrics alone cannot express.
        - local-blocks
